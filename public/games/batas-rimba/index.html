    if (o.kepala === 'jilbab'){ p.rect(4, 3, 10, 12, o.jilbab[1]); p.rect(5, 2, 8, 1, o.jilbab[1]); p.rect(4, 3, 10, 1, o.jilbab[2]); p.rect(3, 6, 1, 8, o.jilbab[0]); p.rect(14, 6, 1, 8, o.jilbab[0]); }
    p.rect(8, 12, 2, 2, k[1]);
    if (o.kepala === 'jilbab'){ p.rect(6, 5, 6, 7, k[2]); p.rect(11, 6, 1, 5, k[1]); }
    else { p.rect(6, 5, 6, 7, k[2]); p.rect(5, 6, 8, 5, k[2]); p.rect(11, 6, 1, 5, k[1]); p.rect(12, 7, 1, 3, k[1]); p.set(4, 8, k[1]); p.set(13, 8, k[1]); }
    p.set(7, 8, W.garis); p.set(10, 8, W.garis); p.rect(8, 10, 2, 1, k[0]);
    if (o.kumis) p.rect(7, 10, 4, 1, rambut);
    if (o.kacamata){ for (const [x, c] of [[6, '#2A2A2A'], [7, '#BDE6FA'], [8, '#2A2A2A'], [9, '#2A2A2A'], [10, '#BDE6FA'], [11, '#2A2A2A']]) p.set(x, 8, c); }
    switch (o.kepala){
      case 'rambut': p.rect(5, 3, 8, 3, rambut); p.rect(4, 4, 1, 4, rambut); p.rect(13, 4, 1, 4, rambut); break;
      case 'peci': p.rect(5, 2, 8, 4, '#1E1E26'); p.rect(5, 2, 8, 1, '#3A3A48'); p.set(5, 6, rambut); p.set(12, 6, rambut); break;
      case 'caping': [[8, 0, 2], [6, 1, 6], [4, 2, 10], [2, 3, 14], [1, 4, 16]].forEach(([x, y, w], j) => p.rect(x, y, w, 1, ['#E8CC80', '#C9A65A', '#E8CC80', '#C9A65A', '#9A7A3A'][j])); break;
      case 'helm': p.rect(5, 2, 8, 3, '#F2C230'); p.rect(6, 1, 6, 1, '#F2C230'); p.rect(4, 5, 10, 1, '#D9A51A'); p.set(7, 2, '#FFF0A0'); break;
      case 'rimba': p.rect(6, 2, 6, 3, o.topi); p.rect(3, 5, 12, 1, o.topiGelap); break;
      case 'topi': p.rect(5, 3, 8, 3, o.topi); p.rect(11, 5, 4, 1, o.topiGelap); p.set(5, 6, rambut); break;
      case 'ikat': p.rect(5, 3, 8, 3, rambut); p.rect(4, 4, 1, 4, rambut); p.rect(13, 4, 1, 4, rambut); p.rect(5, 5, 8, 1, '#C8361B'); p.set(13, 6, '#C8361B'); p.set(14, 7, '#C8361B'); break;
    }
  }
  p.garisTepi(W.garis);
  return (IKON[kunci] = p.kanvas().toDataURL());
}

function rincianPetak(t){
  const L = [];
  const petani = S && S.peran === 'petani';
  if (t.api > 0) L.push(['Sedang terbakar.' + (t.gambut ? ' Api gambut bisa bertahan sampai 2 bulan.' : ' Bisa menjalar ke petak sebelah di akhir bulan.'), true]);
  if (t.ancaman) L.push([`${NAMA_ANCAMAN[t.ancaman]}. ${KET_ANCAMAN[t.ancaman]}`, true]);
  if (t.jenis === 'sawit'){
    if (t.umur < 12) L.push([`Mulai berbuah ${12 - t.umur} bulan lagi.`]);
    else if (t.umur < 18) L.push(['Baru berbuah, hasilnya belum penuh.']);
    if (t.milik === 'pemain'){
      L.push([`Bibit ${t.bibit === 'unggul' ? 'bersertifikat' : 'asalan'}. Perawatan ${['terbengkalai', 'kurang', 'cukup', 'penuh'][t.rawat]}.`]);
      if (t.umur >= 12 && S) L.push([`Perkiraan panen ${fmtTon(hasilTon(t))} TBS per bulan, sekitar ${fmtRp(hasilTon(t) * 1000 * (hargaTerima() - ONGKOS))} bersih.`]);
    }
  }
  if (t.jenis === 'hutan'){
    if (S && S.peran === 'penjaga' && t.rapat >= 2) L.push([`Hasil hutan siap panen: ${t.hhbk} dari ${t.rapat} bagian.`]);
    if (t.rapat < 3 && !t.ancaman) L.push(['Kalau aman setahun, hutan ini bertambah rapat.']);
  }
  if (t.jenis === 'rehab') L.push([`Jadi hutan muda ${Math.max(1, 10 - t.umur)} bulan lagi.`]);
  if (t.jenis === 'terbakar') L.push([`Bisa ditanami. Kalau dibiarkan, jadi semak ${Math.max(1, 4 - t.umur)} bulan lagi.`]);
  if (t.gambut) L.push([t.kanal ? 'Tanah gambut yang dikeringkan kanal. Sangat mudah terbakar.' : t.sekat ? 'Tanah gambut. Kanalnya sudah disekat, gambut kembali basah.' : 'Tanah gambut yang masih basah.']);
  if (t.sekatBakar) L.push(['Dikelilingi sekat bakar.']);
  if (t.kawasan && (t.milik === 'pemain' || t.milik === 'tetangga') && t.jenis !== 'hutan') L.push(['Berada di dalam kawasan hutan tanpa izin.', true]);
  if (petani && t.dijual) L.push([`Dijual ${fmtRp(t.dijual)}.`]);
  if (S && !t.api){ const r = risikoTeks(t); if (r) L.push([`Risiko terbakar bulan ini: ${r}.`, r === 'sangat tinggi']); }
  return L;
}

      <article class="peran">${img(gambarPetani)}
        <h3>Petani sawit swadaya</h3>
        <p>Kamu mengurus kebun warisan orang tua di tepi hutan. Buah harus dijual, dapur harus mengepul, dan hutan di sebelah kebun terlihat menggoda.</p>
        <ul><li>6 hektare: 4 kebun sawit, 2 semak</li><li>Uang Rp 8 juta, 3 tenaga per bulan</li></ul>
        <button class="tombol-utama" data-peran="petani" data-kunci="peran-petani">Main sebagai petani sawit</button>
      </article>
      <article class="peran">${img(gambarPenjaga)}
        <h3>Kelompok penjaga hutan</h3>
        <p>Kamu memimpin kelompok warga yang menjaga hutan di belakang desa. Pembalak, perambah, dan api datang lebih cepat daripada tenaga kalian.</p>
        <ul><li>24 petak hutan untuk dijaga</li><li>Kas Rp 4 juta, 4 tenaga per bulan</li></ul>
        <button class="tombol-utama" data-peran="penjaga" data-kunci="peran-penjaga">Main sebagai penjaga hutan</button>
      </article>
    </div>
    <p class="pratinjau" role="status">${t ? `<strong>${kode(t)} · ${namaPetak(t)}.</strong> ${pemilikTeks(t)}.` : 'Ketuk petak di ladang untuk mengenal desa sebelum mulai.'}</p>
    <p class="catatan-kaki">Desa, tokoh, harga, dan peluang di permainan ini rekaan dan disederhanakan untuk bermain. Catatan lapangan yang muncul selama bermain merujuk pada aturan dan praktik nyata di Indonesia.</p>
  </section>`;
}

// perkiraan harga lahan sah milik pemain; kebun di kawasan hutan tidak bisa dijual sah
function nilaiLahan(){
  let n = 0;
  for (const t of S.petak){
    if (t.milik !== 'pemain' || t.kawasan) continue;
    let v = t.jenis === 'sawit' ? (t.umur >= 12 ? 45e6 : 30e6) : 18e6;
    if (t.gambut) v *= 0.5;
    n += v;
  }
  return n;
}

function hasilAkhir(){
  const hutan = jumlahHutan();
  const sel = hutan - S.hutanAwal;
  const asapTeks = S.asapPuncak.nilai > 0 ? `${labelAsap(S.asapPuncak.nilai)}, ${namaBulan(S.asapPuncak.bulan)} tahun ${tahunKe(S.asapPuncak.bulan)}` : 'Tidak pernah berasap';
  if (S.peran === 'petani'){
    const bersih = S.uang - totalUtang();
    const lahan = nilaiLahan();
    const tumbuh = bersih + lahan >= S.uangAwal + S.lahanAwal;
    const kebun = S.petak.filter(t => t.milik === 'pemain' && t.jenis === 'sawit' && t.umur >= 12).length;
    const luas = S.petak.filter(t => t.milik === 'pemain').length;
    const bersalah = S.stat.hutanDibuka > 0 || S.stat.bakar > 0;
    let judul, teks;
    if (S.selesai.jenis === 'sita'){ judul = 'Kebun berpindah tangan'; teks = 'Utangmu menembus Rp 35 juta. Tengkulak dan bank mengambil kebun sebagai pelunasan. Banyak petani swadaya kehilangan kebun lewat jalan yang sama: panen seret, harga turun, lalu bunga utang terus berjalan.'; }
    else if (S.stat.ketahuan > 0 || S.stat.ditertibkan > 0){ judul = 'Berurusan dengan hukum'; teks = 'Kebunmu sempat tumbuh, tapi jalan pintasnya berujung denda dan penyitaan. Lahan di kawasan hutan dan api di musim kering jarang luput selamanya.'; }
    else if (!bersalah && tumbuh){ judul = 'Pekebun yang tahu batas'; teks = 'Kamu tidak membuka hutan dan tidak membakar. Kebunmu tumbuh lewat perawatan, lahan yang sah, dan harga yang lebih baik.'; }
    else if (bersalah && tumbuh){ judul = 'Untung di atas abu'; teks = 'Hartamu lebih banyak dari dua tahun lalu. Sebagian datang dari hutan yang dibuka dan api yang dinyalakan, dan asapnya dihirup seluruh kampung.'; }
    else { judul = 'Bertahan dari musim ke musim'; teks = 'Kebun masih di tanganmu, tapi hartamu menyusut. Harga, pupuk, dan kebutuhan rumah tangga menghabiskan hampir semua hasil panen.'; }
    teks += ` Selama permainan, ${Math.max(0, -sel)} petak hutan hilang dari peta${S.stat.hutanDibuka ? `, ${S.stat.hutanDibuka} di antaranya kamu buka sendiri` : ''}.`;
    return {judul, teks, baris:[
      ['Uang dikurangi utang', `${fmtRp(S.uangAwal)} → ${fmtRp(bersih)}`],
      ['Perkiraan nilai lahan sah', `${fmtRp(S.lahanAwal)} → ${fmtRp(lahan)}`],
      ['Lahan milikmu', `6 ha → ${luas} ha`],
      ['Kebun yang berbuah', `${S.kebunAwal} ha → ${kebun} ha`],
      ['Panen selama permainan', fmtTon(S.stat.panenTon)],
      ['Hutan yang kamu buka', `${S.stat.hutanDibuka} petak`],
      ['Petak orang lain terbakar dari apimu', `${S.stat.petakTerbakarApimu}`],
      ['Denda dan penyitaan', `${S.stat.ketahuan + S.stat.ditertibkan} kali`],
      ['Hutan di peta', `${S.hutanAwal} → ${hutan} petak`],
      ['Asap terparah', asapTeks],
    ]};
  }
  let judul, teks;
  if (S.selesai.jenis === 'bubar'){ judul = 'Kelompok bubar'; teks = 'Dukungan warga habis. Tanpa anggota, patroli berhenti dan hutan dibiarkan tanpa penjaga.'; }
  else if (sel >= -2 && S.dukungan >= 55){ judul = 'Hutan desa yang hidup'; teks = 'Hutan bertahan dan warga ikut merasakan hasilnya. Penjagaan seperti ini bertahan lama karena warga punya alasan untuk ikut menjaga.'; }
  else if (sel >= -2){ judul = 'Hutan terjaga, warga lelah'; teks = 'Hutannya bertahan, tapi dukungan warga menipis. Tanpa hasil yang dirasakan warga, penjagaan sulit bertahan lebih lama.'; }
  else if (sel >= -6){ judul = 'Bertahan dengan luka'; teks = 'Sebagian hutan hilang, tapi kelompok masih berdiri dan sebagian besar kawasan masih utuh.'; }
  else { judul = 'Rimba yang menyusut'; teks = 'Ancaman datang lebih cepat daripada tenaga kelompok. Hutan di belakang desa kini jauh lebih sempit.'; }
  return {judul, teks, baris:[
    ['Hutan di peta', `${S.hutanAwal} → ${hutan} petak`],
    ['Hutan lebat', `${S.lebatAwal} → ${jumlahHutanLebat()} petak`],
    ['Dukungan warga', `55 → ${S.dukungan}`],
    ['Kas kelompok', `${fmtRp(S.uangAwal)} → ${fmtRp(S.uang)}`],
    ['Api yang dipadamkan kelompok', `${S.stat.apiDipadam}`],
    ['Ancaman yang dihadang', `${S.stat.ancamanDicegah}`],
    ['Petak yang ditanami pohon', `${S.stat.pohon}`],
    ['Kanal yang disekat', `${S.stat.sekatKanal}`],
    ['Izin Hutan Desa', S.izin === 5 ? 'Terbit' : S.izin > 0 ? 'Masih diproses' : 'Tidak diajukan'],
    ['Asap terparah', asapTeks],
  ]};
}

function htmlAkhir(){
  const a = hasilAkhir();
  const lain = S.peran === 'petani' ? 'penjaga' : 'petani';
  const nama = p => p === 'petani' ? 'petani sawit' : 'penjaga hutan';
  return `<section class="blok akhir jendela" aria-labelledby="judul-akhir">
    <p class="kicker">${S.selesai.jenis === 'waktu' ? 'Dua tahun berlalu' : `Permainan berakhir di bulan ke-${S.bulan}`}</p>
    <h2 id="judul-akhir" tabindex="-1">${a.judul}</h2>
    <p>${a.teks}</p>
    <dl class="neraca">${a.baris.map(([l, v]) => `<div><dt>${l}</dt><dd>${v}</dd></div>`).join('')}</dl>
    <div class="tombol-akhir">
      <button class="tombol-utama" data-peran="${lain}" data-kunci="akhir-lain">Main sebagai ${nama(lain)}</button>
      <button class="tombol" data-peran="${S.peran}" data-kunci="akhir-sama">Ulangi sebagai ${nama(S.peran)}</button>
    </div>
  </section>`;
}

function renderBuku(){
  const el = $('#buku');
  if (!S) el.innerHTML = htmlPilihPeran();
  else if (S.selesai) el.innerHTML = htmlAkhir() + htmlKabar();
  else el.innerHTML = htmlBilah() + htmlPeristiwa() + htmlPerhatian() + htmlPetak() + htmlUmum() + htmlKabar() + htmlCara();
  $('#app').classList.toggle('ada-bilah', !!S && !S.selesai);
}

function renderLegenda(){
  const petani = S && S.peran === 'petani';
  const item = [
    ['Hutan lebat', {jenis:'hutan', rapat:3}], ['Hutan sedang', {jenis:'hutan', rapat:2}], ['Hutan tipis, ada tunggul tebangan', {jenis:'hutan', rapat:1}],
    ['Hutan rawa gambut (ada genangan)', {jenis:'hutan', rapat:3, gambut:true}], ['Kanal pengering gambut', {jenis:'semak', gambut:true, kanal:true}],
    ['Kanal yang disekat', {jenis:'semak', gambut:true, sekat:true}], ['Kebun sawit berbuah', {jenis:'sawit', umur:20}], ['Sawit muda', {jenis:'sawit', umur:2}],
    ['Sawit tak terawat', {jenis:'sawit', umur:20, rawat:0}], ['Semak belukar', {jenis:'semak'}], ['Lahan terbuka', {jenis:'terbuka'}],
    ['Bekas terbakar', {jenis:'terbakar', umur:2}], ['Bibit pohon pemulihan', {jenis:'rehab'}], ['Rumah warga', {jenis:'desa', r:4, c:0}], ['Sungai', {jenis:'sungai'}],
    ['Sekat bakar', {jenis:'sawit', umur:20, sekatBakar:true}], ['Titik api', {jenis:'semak', api:1}],
    ['Pembalak liar', {jenis:'hutan', rapat:3, ancaman:'pembalak'}], ['Pemburu satwa', {jenis:'hutan', rapat:3, ancaman:'pemburu'}],
    ['Perambah hutan', {jenis:'hutan', rapat:3, ancaman:'perambah'}],
  ];
  if (petani){ item.push(['Lahanmu (berpagar)', {jenis:'sawit', umur:20, milik:'pemain'}]); item.push(['Lahan dijual', {jenis:'semak', dijual:1}]); }
  const html = item.map(([nama, o], k) => {
    const t = Object.assign({r: k % BARIS, c: (k * 3) % KOLOM, rapat:0, umur:0, api:0, rawat:2, milik:'desa', kawasan:false}, o);
    return `<li>${img(urlPetak(t, {pagar:true, jual:true}))}<span>${nama}</span></li>`;
  }).join('') + `<li>${img(urlPetak({r:2, c:1, jenis:'semak', rapat:0, umur:0, api:0, milik:'desa'}, {batas:true}))}<span>Batas kawasan hutan</span></li>`;
  $('#legenda-daftar').innerHTML = html;
}

/* ================= render & fokus ================= */
let legendaPeran = undefined;
function render(opsi){
  opsi = opsi || {};
  const aktif = document.activeElement;
  const kunci = aktif && aktif.dataset ? aktif.dataset.kunci : null;
  const diBuku = aktif && $('#buku').contains(aktif);
  const diKepala = aktif && $('#kepala-kanan').contains(aktif);
  const caraTerbuka = $('#cara') ? $('#cara').open : false;

  renderKepala();
  renderDasbor();
  renderPeta();
  renderBuku();
  if ($('#cara') && caraTerbuka) $('#cara').open = true;
  const peranSekarang = S ? S.peran : null;
  if (legendaPeran !== peranSekarang){ renderLegenda(); legendaPeran = peranSekarang; }

  let target = null;
  if (opsi.fokus) target = $(opsi.fokus);
  else if (kunci && (diBuku || diKepala)) target = document.querySelector(`[data-kunci="${kunci}"]`) || (diBuku ? $('#judul-buku') : null);
  else if (diBuku || diKepala) target = $('#judul-buku');
  if (target){
    target.focus({preventScroll: true});
    if (opsi.gulirKe || !diBuku) gulirJikaPerlu(target);
  }
  simpan();
}
function gulirJikaPerlu(el){
  const r = el.getBoundingClientRect();
  const bawah = window.innerHeight - (window.matchMedia('(max-width: 880px)').matches ? 96 : 0);
  if (r.top < 0 || r.top > bawah - 40) el.scrollIntoView({block:'start', behavior: gerakBoleh() ? 'smooth' : 'auto'});
}
function umumkan(teks){ const el = $('#pengumuman'); el.textContent = ''; setTimeout(() => { el.textContent = teks; }, 30); }

function pilihPetak(i, dariTombolLain){
  if (S){ S.pilih = i; } else pilihPratinjau = i;
  umpan = '';
  render();
  const b = elPeta.children[i];
  if (dariTombolLain){
    // dari daftar "Perlu perhatian": tampilkan petak di peta lalu kembalikan fokus ke panel petak
    $('#judul-buku') && $('#judul-buku').focus({preventScroll:true});
    gulirJikaPerlu($('#judul-buku'));
  } else {
    b.focus({preventScroll:true});
    if (window.matchMedia('(max-width: 880px)').matches){
      // di ponsel panel petak ada di bawah ladang; naikkan sampai sekitar 40% layar, di atas bilah kalender
      const h = $('#judul-buku');
      if (h){ const r = h.getBoundingClientRect(); if (r.top > window.innerHeight * 0.55) window.scrollBy({top: r.top - window.innerHeight * 0.4, behavior: gerakBoleh() ? 'smooth' : 'auto'}); }
    }
  }
}

/* ================= simpan ================= */
function simpan(){
  try { if (S) localStorage.setItem(KUNCI, JSON.stringify(S)); else localStorage.removeItem(KUNCI); } catch (e) { /* penyimpanan peramban tidak tersedia */ }
}
function muat(){
  try {
    const s = localStorage.getItem(KUNCI);
    if (!s) return null;
    const o = JSON.parse(s);
    if (o && o.versi === 1 && Array.isArray(o.petak) && o.petak.length === KOLOM * BARIS) return o;
  } catch (e) { /* data rusak atau tidak bisa dibaca */ }
  return null;
}

/* ================= kejadian ================= */
function mulaiPeran(peran){
  konfirmUlang = false;
  umpan = '';
  berubah = new Set();
  permainanBaru(peran, (Date.now() ^ Math.floor(Math.random() * 4294967296)) >>> 0);
  render({fokus:'#judul-buku', gulirKe:true});
  umumkan(`Permainan dimulai sebagai ${peran === 'petani' ? 'petani sawit' : 'penjaga hutan'}. ${namaBulan(0)}, tahun 1.`);
}

elPeta.addEventListener('click', e => {
  const b = e.target.closest('.petak');
  if (!b) return;
  pilihPetak(+b.dataset.i, false);
});
elPeta.addEventListener('keydown', e => {
  const b = e.target.closest('.petak');
  if (!b) return;
  const i = +b.dataset.i, r = Math.floor(i / KOLOM), c = i % KOLOM;
  let n = null;
  if (e.key === 'ArrowUp' && r > 0) n = i - KOLOM;
  else if (e.key === 'ArrowDown' && r < BARIS - 1) n = i + KOLOM;
  else if (e.key === 'ArrowLeft' && c > 0) n = i - 1;
  else if (e.key === 'ArrowRight' && c < KOLOM - 1) n = i + 1;
  else if (e.key === 'Home') n = r * KOLOM;
  else if (e.key === 'End') n = r * KOLOM + KOLOM - 1;
  if (n === null) return;
  e.preventDefault();
  pilihPetak(n, false);
});
$('#buku').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.aksi) lakukan(d.aksi);
  else if (d.pilih !== undefined) putuskan(+d.pilih);
  else if (d.peran) mulaiPeran(d.peran);
  else if (d.bulan !== undefined) akhiriBulan();
  else if (d.keKabar !== undefined){ const k = $('#kartu-kabar'); if (k){ k.focus({preventScroll:true}); k.scrollIntoView({block:'start', behavior: gerakBoleh() ? 'smooth' : 'auto'}); } }
  else if (d.lompat !== undefined) pilihPetak(+d.lompat, true);
});
$('#kepala-kanan').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.ganti !== undefined){
    if (S && S.selesai){ S = null; simpan(); render({fokus:'#judul-buku', gulirKe:true}); return; }
    konfirmUlang = true; render({fokus:'[data-kunci="batal-ulang"]'});
  } else if (b.dataset.batalUlang !== undefined){ konfirmUlang = false; render({fokus:'[data-kunci="ganti"]'}); }
  else if (b.dataset.yaUlang !== undefined){ konfirmUlang = false; S = null; pilihPratinjau = null; simpan(); render({fokus:'#judul-buku', gulirKe:true}); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && konfirmUlang){ konfirmUlang = false; render({fokus:'[data-kunci="ganti"]'}); }
});

/* ================= mulai ================= */
function mulai(data){
  PRATINJAU = buatSemuaPetak('pratinjau');
  bangunPeta();
  aturAnimasi();
  try { window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', () => { aturAnimasi(); renderPeta(); }); } catch (e) { /* peramban lama */ }
  S = (data && data.S) || muat();
  if (window.matchMedia('(min-width: 881px)').matches) $('#legenda').open = true;
  render();
}
window.__batasRimba = {
  keadaan: () => S,
  baru: (peran, benih) => { permainanBaru(peran, benih); render(); },
  akhiri: akhiriBulan, lakukan, putuskan, pilih: i => { S.pilih = i; render(); },
  aksiPetak: i => aksiPetak(S.petak[i]).map(a => ({id:a.id, bisa:a.bisa})), aksiUmum: () => aksiUmum().map(a => ({id:a.id, bisa:a.bisa})),
};
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({S}));
if (hot && typeof hot.ready === 'function') hot.ready(mulai);
else mulai((hot && hot.data) || {});
})();
</script>
